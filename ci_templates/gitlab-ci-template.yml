# ─────────────────────────────────────────────────────────────────────
# Spec-Driven Development Pipeline — GitLab CI Template
#
# Include this template in target JavaScript/TypeScript repos via:
#   include:
#     - project: 'your-group/SpecDrivenDevAutomation'
#       file: 'ci_templates/gitlab-ci-template.yml'
#
# The orchestrator triggers this pipeline in two modes:
#   1. TEST_ONLY=true  (Stage 3): runs only the 'test' stage.
#   2. Full pipeline   (Stage 4): runs all stages sequentially.
# ─────────────────────────────────────────────────────────────────────

stages:
  - test
  - lint
  - sast
  - dependency-scan
  - test-coverage
  - quality-gate

# ── Variables ──────────────────────────────────────────────────────────
variables:
  # Override TEST_PATTERN to run a subset of tests (default: all).
  TEST_PATTERN: ""
  # Set TEST_ONLY=true to skip lint/sast/coverage/quality-gate stages.
  TEST_ONLY: "false"

# ── Stage: test ────────────────────────────────────────────────────────
test:
  stage: test
  image: node:20-slim
  script:
    - npm ci --prefer-offline
    - |
      if [ -n "$TEST_PATTERN" ]; then
        npx jest --testPathPattern="$TEST_PATTERN" --json --outputFile=jest-results.json
      else
        npx jest --json --outputFile=jest-results.json
      fi
  artifacts:
    when: always
    paths:
      - jest-results.json
    reports:
      junit: jest-results.json
    expire_in: 7 days

# ── Stage: lint ────────────────────────────────────────────────────────
lint:
  stage: lint
  image: node:20-slim
  rules:
    - if: '$TEST_ONLY == "true"'
      when: never
    - when: on_success
  script:
    - npm ci --prefer-offline
    - npx eslint . --format json --output-file eslint-report.json || true
    # Fail on any error-level findings.
    - npx eslint . --max-warnings=0
  artifacts:
    when: always
    paths:
      - eslint-report.json
    expire_in: 7 days

# ── Stage: sast ────────────────────────────────────────────────────────
sast:
  stage: sast
  image: returntocorp/semgrep:latest
  rules:
    - if: '$TEST_ONLY == "true"'
      when: never
    - when: on_success
  script:
    - semgrep --config=auto --json --output semgrep-report.json .
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 7 days

# ── Stage: dependency-scan ─────────────────────────────────────────────
dependency-scan:
  stage: dependency-scan
  image: aquasec/trivy:latest
  rules:
    - if: '$TEST_ONLY == "true"'
      when: never
    - when: on_success
  script:
    - trivy fs --format json --output trivy-report.json .
    # Fail on critical CVEs.
    - trivy fs --severity CRITICAL --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 7 days

# ── Stage: test-coverage ───────────────────────────────────────────────
test-coverage:
  stage: test-coverage
  image: node:20-slim
  rules:
    - if: '$TEST_ONLY == "true"'
      when: never
    - when: on_success
  script:
    - npm ci --prefer-offline
    - npx jest --coverage --coverageReporters=lcov --coverageReporters=text
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days

# ── Stage: quality-gate ────────────────────────────────────────────────
quality-gate:
  stage: quality-gate
  image: sonarsource/sonar-scanner-cli:latest
  rules:
    - if: '$TEST_ONLY == "true"'
      when: never
    - if: '$SONAR_HOST_URL == ""'
      when: never
    - when: on_success
  script:
    - >
      sonar-scanner
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.sources=src
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      -Dsonar.eslint.reportPaths=eslint-report.json
    # Poll SonarQube for quality gate status.
    - |
      echo "Waiting for SonarQube analysis..."
      sleep 10
      STATUS=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$CI_PROJECT_NAME" | jq -r '.projectStatus.status')
      echo "Quality Gate Status: $STATUS"
      if [ "$STATUS" != "OK" ]; then
        echo "Quality gate FAILED"
        exit 1
      fi
